<!-- Image_Transcription/templates/image_transcription/transcription.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcripción de Imagen</title>
</head>
<body>
    <h1>Transcripción de Imagen</h1>
    <!-- Botón para volver a otra página (ajusta href a la página que desees) -->
    <a href="{% url 'nombre_de_la_pagina_anterior' %}">Volver</a>
    
    <!-- Formulario para subir una nueva imagen y transcribir -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Subir y transcribir</button>
    </form>

    <!-- Botón para iniciar la transcripción de la última imagen subida -->
    {% if ocr_result %}
        <button id="transcribeLastImageButton">Iniciar transcripción con la última imagen</button>
    {% endif %}

    <!-- Resultado de OCR -->
    {% if ocr_result %}
        <h2>Texto Extraído:</h2>
        <pre>{{ ocr_result }}</pre>
    {% endif %}

    <script>
        // Simulación de transcripción de la última imagen al hacer clic
        document.getElementById('transcribeLastImageButton').onclick = function() {
            // Aquí puedes enviar una solicitud automática al servidor si la funcionalidad lo permite.
            // En este caso, simplemente recargará la página o puedes simular el proceso.
            alert("Transcribiendo la última imagen...");
            location.reload();
        };
    </script>
</body>
</html>
